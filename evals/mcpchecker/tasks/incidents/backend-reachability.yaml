kind: Task
apiVersion: mcpchecker/v1alpha2
metadata:
  name: "backend-reachability"
  difficulty: easy
  parallel: true
  runs: 1
  labels:
    category: incidents
    suite: cluster-health
    toolType: smoke-test
  description: |
    Smoke test to verify the agent can reach the cluster-health MCP server
    and get a valid response from the get_incidents tool.
spec:
  verify:
    - llmJudge:
        contains: "The incidents tool responded successfully."
  prompt:
    inline: |
      Can the cluster-health MCP server retrieve incidents? Use its incidents
      tool, report whether the call succeeded, and list any currently firing
      incidents.
