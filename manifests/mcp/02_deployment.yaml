# creats a 1 pod deployment for the cluster-health-analyzer
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: cluster-health-analyzer-mcp
  name: cluster-health-analyzer-mcp
  namespace: openshift-cluster-observability-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cluster-health-analyzer-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cluster-health-analyzer-mcp
    spec:
      serviceAccountName: cluster-health-analyzer-mcp-thanos-querier
      automountServiceAccountToken: true
      volumes:
        - name: tls-certs
          secret:
            secretName: cluster-health-analyzer-mcp-tls
        - name: tmp
          emptyDir: {}
      containers:
      - name: cluster-health-mcp-server
        image: "quay.io/openshiftanalytics/cluster-health-analyzer:mcp-dev-preview"
        volumeMounts:
          - name: tls-certs
            mountPath: /etc/tls/private
            readOnly: true
          - name: tmp
            mountPath: /tmp
        imagePullPolicy: Always
        args:
          - mcp
          - --tls-cert-file=/etc/tls/private/tls.crt
          - --tls-private-key-file=/etc/tls/private/tls.key
        env:
          - name: PROM_URL
            value: "https://thanos-querier.openshift-monitoring.svc.cluster.local:9091/"
          - name: ALERTMANAGER_URL
            value: "https://alertmanager-main.openshift-monitoring.svc.cluster.local:9094"
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
          seccompProfile:
            type: RuntimeDefault
        ports:
        - containerPort: 8085
          name: mcp
        livenessProbe:
          httpGet:
            path: /healthz
            port: mcp
            scheme: HTTPS
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /healthz
            port: mcp
            scheme: HTTPS
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
        terminationMessagePolicy: FallbackToLogsOnError
